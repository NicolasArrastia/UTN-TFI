<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("utn-tfi-theme");
          var theme =
            stored === "emerald" || stored === "gray" || stored === "indigo"
              ? stored
              : "indigo";

          document.documentElement.dataset.theme = theme;

          var favicon = document.getElementById("app-favicon");

          if (favicon) {
            favicon.setAttribute("href", "/favicon-" + theme + ".svg");
          }
        } catch (error) {
          document.documentElement.dataset.theme = "indigo";
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTN TFI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
